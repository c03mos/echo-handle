services:
  handle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echo-handle
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ../Data:/app/data
      - ../echo_data:/app/echo_data
      - ../modelZoo:/app/models
